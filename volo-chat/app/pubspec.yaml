name: volo_chat
description: "Volo Chat — messages, HD voice & video calls, Status, groups, live location and SOS. By BWP Experts."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  url_launcher: ^6.3.0
  share_plus: ^10.1.2
  geolocator: ^13.0.1
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  flutter_local_notifications: ^18.0.1
  flutter_webrtc: ^0.12.12
  audioplayers: ^6.1.0
  record: ^6.1.1
  flutter_background_service: ^5.1.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#0D0B1E"
  adaptive_icon_foreground: "assets/images/icon_fg.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/sounds/ringback.wav
    - assets/sounds/ringtone.wav
