name: Android Build (APK + AAB)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap platform folders
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: bash ../scripts/bootstrap_platforms.sh

      - name: Build release APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          PAIR_API_BASE: ${{ secrets.PAIR_API_BASE }}
        run: flutter build apk --release --dart-define=MAPS_API_KEY=${MAPS_API_KEY:-} --dart-define=PAIR_API_BASE=${PAIR_API_BASE:-}

      - name: Build release AAB
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          PAIR_API_BASE: ${{ secrets.PAIR_API_BASE }}
        run: flutter build appbundle --release --dart-define=MAPS_API_KEY=${MAPS_API_KEY:-} --dart-define=PAIR_API_BASE=${PAIR_API_BASE:-}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UmrahTrip-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: UmrahTrip-release-aab
          path: app/build/app/outputs/bundle/release/app-release.aab

      # Public, login-free download links on the rolling "latest" release.
      - name: Publish APK + AAB to 'latest' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE"
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Umrah Trip — latest builds" \
              --notes "Rolling release: freshest APK/AAB/IPA from main. IPA is unsigned (install via Sideloadly/AltStore)."
          cp app/build/app/outputs/flutter-apk/app-release.apk UmrahTrip.apk
          cp app/build/app/outputs/bundle/release/app-release.aab UmrahTrip.aab
          gh release upload latest UmrahTrip.apk UmrahTrip.aab --clobber

      # ---- Quality gates: run after artifacts so a style issue never blocks
      # a usable build; full output is posted as a commit comment. The job
      # still turns red if analysis finds errors or tests fail. ----
      - name: Analyze + tests (report)
        id: qa
        continue-on-error: true
        run: |
          set +e
          {
            echo "### flutter analyze"
            flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1
            a=$?
            echo ""
            echo "### flutter test"
            flutter test 2>&1
            t=$?
            echo ""
            echo "analyze_exit=$a test_exit=$t"
            exit $(( a + t ))
          } | tee qa-report.txt
          exit ${PIPESTATUS[0]}

      - name: Post QA report as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY_FILE=qa-report.txt
          head -c 60000 "$BODY_FILE" > qa-trimmed.txt
          printf '**Android CI QA report** (`%s`)\n\n```\n' "${GITHUB_SHA::7}" > comment.md
          cat qa-trimmed.txt >> comment.md
          printf '\n```\n' >> comment.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@comment.md >/dev/null

      - name: Fail job if QA failed
        if: steps.qa.outcome == 'failure'
        run: |
          echo "Analyzer/tests reported problems — see the commit comment."
          exit 1
