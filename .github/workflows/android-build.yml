name: Android Build (APK + AAB)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap platform folders
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: bash ../scripts/bootstrap_platforms.sh

      - name: Analyze (errors fatal, style warnings reported only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit tests (itinerary + visit tracking)
        run: flutter test

      - name: Build release APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: flutter build apk --release --dart-define=MAPS_API_KEY=${MAPS_API_KEY:-}

      - name: Build release AAB
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: flutter build appbundle --release --dart-define=MAPS_API_KEY=${MAPS_API_KEY:-}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UmrahTrip-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: UmrahTrip-release-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
