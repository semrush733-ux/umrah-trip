name: Volo Chat — iOS

on:
  push:
    branches: [main]
    paths: ['volo-chat/**', '.github/workflows/volo-*.yml']
  workflow_dispatch:
    inputs:
      runner:
        description: 'macOS runner label (e.g. macos-15, macos-14, macos-15-intel, macos-latest)'
        required: false
        default: 'macos-15'

permissions:
  contents: write

concurrency:
  group: volo-ios-${{ github.ref }}-${{ inputs.runner || 'default' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    defaults:
      run:
        working-directory: volo-chat/app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap platform folders
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: bash ../scripts/bootstrap_platforms.sh

      - name: Build iOS (release, no codesign)
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          VOLO_API_BASE: ${{ secrets.VOLO_API_BASE }}
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign --dart-define=MAPS_API_KEY=${MAPS_API_KEY:-} --dart-define=VOLO_API_BASE=${VOLO_API_BASE:-} 2>&1 | tee build-ios.log

      - name: Post build failure log as commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f build-ios.log ] || echo "(no build log captured)" > build-ios.log
          printf '**iOS build FAILED** (`%s`)\n\n```\n' "${GITHUB_SHA::7}" > comment.md
          tail -c 45000 build-ios.log >> comment.md
          printf '\n```\n' >> comment.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@comment.md >/dev/null || true

      - name: Package unsigned IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qry VoloChat-unsigned.ipa Payload
          ls -lh VoloChat-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: VoloChat-unsigned-ipa
          path: volo-chat/app/build/ios/iphoneos/VoloChat-unsigned.ipa

      # Public, login-free download link: refreshes the rolling "latest" release.
      - name: Publish IPA to 'volo-latest' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE"
          gh release view volo-latest >/dev/null 2>&1 || \
            gh release create volo-latest --latest=false --title "Volo Chat — latest builds" \
              --notes "Rolling release: freshest APK/AAB/IPA from main. IPA is unsigned (install via Sideloadly/AltStore)."
          gh release upload volo-latest volo-chat/app/build/ios/iphoneos/VoloChat-unsigned.ipa --clobber

# Signed IPA / TestFlight: add Apple certificates + provisioning profile as
# repo secrets, import them with apple-actions/import-codesign-certs, drop
# --no-codesign and run `flutter build ipa --export-options-plist ...`.
# See docs/SETUP.md → "iOS signing".
